name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SENTRY_ORG: waldobear-labs
  SENTRY_PROJECT: flutter
  SENTRY_ENVIRONMENT: production
  SENTRY_CI_ENVIRONMENT: ci

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_CI_RELEASE: cato-ci@${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test tools

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Report check failure to Sentry
        if: failure() && env.SENTRY_DSN != ''
        continue-on-error: true
        run: dart run tools/report_ci_failure_to_sentry.dart

  android-release-artifact:
    name: Android release artifact
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_CI_RELEASE: cato-ci@${{ github.sha }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_RELEASE: cato@0.1.0+${{ github.run_number }}
      SPLIT_DEBUG_INFO_DIR: build/sentry-debug-info

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release secrets
        run: |
          missing=0
          for name in SENTRY_DSN PRIVACY_POLICY_URL; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::$name secret is required for release artifact builds"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build release app bundle
        env:
          ENV_FILE: /tmp/cato-ci-release.env
        run: |
          cat > "$ENV_FILE" <<EOF
          SENTRY_DSN=$SENTRY_DSN
          SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT
          SENTRY_RELEASE=$SENTRY_RELEASE
          PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
          EOF
          bash tools/build_production_appbundle.sh

      - name: Upload Sentry debug files
        if: env.SENTRY_AUTH_TOKEN != ''
        run: dart run sentry_dart_plugin

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cato-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Report release artifact failure to Sentry
        if: failure() && env.SENTRY_DSN != ''
        continue-on-error: true
        run: dart run tools/report_ci_failure_to_sentry.dart
