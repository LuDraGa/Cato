name: cato
description: "Local-first daily self-tracking for habits, mood, and routines."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  go_router: ^14.2.0
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  firebase_core: ^2.31.0
  sentry_flutter: ^9.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_local_notifications: ^17.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  audioplayers: ^6.0.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0
  collection: ^1.18.0
  path: ^1.9.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.3
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/tracker_configs/
    - assets/brand/
    - assets/sounds/save_tap.wav
    - assets/sounds/evening_chime.wav
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/master_logo.png"
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: "assets/brand/foreground_icon.png"

flutter_native_splash:
  color: "#FAF7F2"
  image: "assets/brand/logo_center.png"
  fullscreen: true
  android: true
  ios: false
  web: false

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: true
  symbols_path: build/sentry-debug-info
  commits: auto
  ignore_missing: true
  project: flutter
  org: waldobear-labs
